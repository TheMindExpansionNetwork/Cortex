# Cortex engine container image — built on GitHub Actions, pushed to GHCR.
# This turns hosting/runpod-template.json's imageName placeholder into a real image:
# one-command pod boots on RunPod (or any 2×A100 box) with no local Docker needed.
name: cortex-docker-image

on:
  push:
    branches: [main]
    paths: ["hosting/Dockerfile.cortex", "scripts/deepseek-2xa100.sh", ".github/workflows/cortex-docker-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hosting/Dockerfile.cortex
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cortex:latest
            ghcr.io/${{ github.repository_owner }}/cortex:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
