# Cortex on an Intel Arc card (A-series or B-series, including Arc Pro B70). Needs the xe or i915 kernel driver on the host.
# The Level Zero loader and Intel's compute runtime are in the image (Ubuntu 26.04 based).
#
#   cp .env.example .env
#   docker compose -f docker-compose.intel.yml up -d
#
# TODO(owner): registry name. Until the images are published, build them (docker/build.sh) and use the local tag.
services:
  cortex:
    image: ${CORTEX_IMAGE:-cortex:0.2.0-sycl}
    container_name: cortex
    restart: unless-stopped
    ports:
      - "${CORTEX_BIND:-127.0.0.1}:${CORTEX_PORT:-8080}:8080"
    environment:
      MODEL: ${MODEL:-}
      MODEL_PATH: ${MODEL_PATH:-}            # GGUF files you already have, as seen inside the container (mount them below)
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-}
      VISION: ${VISION:-off}
      TUNE: ${TUNE:-skip}
      API_KEY: ${API_KEY:-}
    volumes:
      - cortex-data:/data
      # - /srv/gguf/IQ3_XXS:/models:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-render}"              # the host's render group id: getent group render | cut -d: -f3 (needed if you add `user:`)
    ulimits:
      memlock: { soft: -1, hard: -1 }
    shm_size: 2gb
    stop_grace_period: 2m
volumes:
  cortex-data:
